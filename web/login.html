<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Alex's Video Maker</title>
<meta name="theme-color" content="#2c76ae">
<meta name="description" content="Phone clips in. A finished vertical video and a caption for each place you post, out.">
<meta property="og:type" content="website">
<meta property="og:title" content="Alex's Video Maker">
<meta property="og:description" content="Your clips. Your voice. Ready to share.">
<meta property="og:image" content="__ORIGIN__/assets/og-image.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Alex's Video Maker: Your clips. Your voice. Ready to share.">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3f7fb; --card:#ffffff; --ink:#1f1f1f; --muted:#54595f; --line:#dbe5ee; --accent:#2c76ae; --accent-ink:#fff; --bad:#a3281f; --good:#2c76ae; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1620; --card:#172230; --ink:#e9eff5; --muted:#9fb0c0; --line:#4d6378; --accent:#6caedf; --accent-ink:#0b1a28; --bad:#f08a80; --good:#6caedf; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink); font:16px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  h1 { margin:0 0 4px; font:650 24px/1.2 "Fraunces",Georgia,serif; }
  .mark { width:46px; height:46px; margin-bottom:14px; border-radius:14px; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); }
  p { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input, select { width:100%; padding:12px; font:inherit; color:var(--ink); background:transparent; border:1.5px solid var(--line); border-radius:10px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  select option { color:#1f1f1f; }
  .pw { position:relative; }
  .pw input { padding-right:52px; }
  .peek { position:absolute; right:2px; top:50%; transform:translateY(-50%); width:44px; height:44px; margin:0; padding:0;
          display:grid; place-items:center; background:transparent; color:var(--muted); border:0; border-radius:8px;
          cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
  .peek:hover, .peek.held { color:var(--ink); background:rgba(127,127,127,.15); }
  button { width:100%; margin-top:20px; padding:13px; font:inherit; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  button:disabled { opacity:.6; }
  .link { width:auto; margin:16px auto 0; display:block; padding:4px; background:none; color:var(--muted); text-decoration:underline; font-weight:400; font-size:14px; }
  .err { min-height:1.4em; margin-top:12px; color:var(--bad); font-size:14px; }
  .help { margin:18px 0 0; font-size:14px; color:var(--muted); text-align:center; }
  .hint { font-size:13px; color:var(--muted); margin:6px 0 0; }
  .hidden { display:none !important; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<script type="module">
// The same quiet 3D scene as on the other pages. Skipped for reduced motion, low-power computers and data saver; any
// failure simply leaves the form as it was.
(async () => {
  try {
    const c = navigator.connection;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || (c && c.saveData) ||
        (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2)) return;
    const mod = await import("/static/scene3d.js");
    const f = document.getElementById("f");
    const stage = document.createElement("div");
    stage.id = "stage3d";
    stage.setAttribute("aria-hidden", "true");
    stage.style.cssText = "height:150px;margin:-14px -10px 4px;border-radius:12px;overflow:hidden;position:relative";
    f.insertBefore(stage, f.firstChild);
    if (!mod.mount(stage, { kind: "house" })) stage.remove();
  } catch (e) { /* the form works without it */ }
})();
</script>
<form id="f">
  <div class="mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="2.5"/><path d="M16 10l5-3v10l-5-3z"/></svg></div>
  <h1>Alex's Video Maker</h1>
  <p>Sign in to make and see your videos.</p>
  <label for="u">Username</label>
  <input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
  <label for="p">Password</label>
  <div class="pw"><input id="p" type="password" autocomplete="current-password" required><button type="button" class="peek" data-for="p" title="Hold to see the password" aria-label="Hold to see the password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button id="b">Sign in</button>
  <div class="err" id="e" role="alert"></div>
  <p class="help" id="help">Forgot your password, or no account yet? <span id="helpText">Ask the person who set up the Video Maker for you.</span></p>
  <button type="button" class="link hidden" id="forgot">Reset a password on this computer</button>
</form>

<form id="r" class="hidden">
  <h1>Pick a new password</h1>
  <p>This only works on the computer running the Video Maker, so nobody can do it from the shared link.</p>
  <label for="ru">Account</label>
  <select id="ru"></select>
  <label for="rp">New password</label>
  <div class="pw"><input id="rp" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="peek" data-for="rp" title="Hold to see the password" aria-label="Hold to see the password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <div class="hint">At least 8 characters.</div>
  <label for="rp2">Type it again</label>
  <div class="pw"><input id="rp2" type="password" autocomplete="new-password" required><button type="button" class="peek" data-for="rp2" title="Hold to see the password" aria-label="Hold to see the password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button id="rb">Save and sign in</button>
  <div class="err" id="re" role="alert"></div>
  <button type="button" class="link" id="back">Back to sign in</button>
</form>
<script>
const $ = id => document.getElementById(id);
document.querySelectorAll(".peek").forEach(b => {
  const input = document.getElementById(b.dataset.for);
  const on = e => { e.preventDefault(); input.type = "text"; b.classList.add("held"); };
  const off = () => { input.type = "password"; b.classList.remove("held"); };
  b.addEventListener("pointerdown", on);
  ["pointerup", "pointerleave", "pointercancel", "blur"].forEach(ev => b.addEventListener(ev, off));
  b.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") on(e); });
  b.addEventListener("keyup", off);
  b.addEventListener("contextmenu", e => e.preventDefault());   // long-press on phones
});

$("f").onsubmit = async ev => {
  ev.preventDefault();
  const b = $("b"), e = $("e");
  b.disabled = true; e.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("u").value.trim(), password: $("p").value }) });
    if (r.ok) return location.href = "/" + location.search;
    const d = (await r.json().catch(() => ({}))).detail;
    e.textContent = r.status === 401 ? "That username or password isn't right. Try again." : d || "Couldn't sign in. Please try again.";
  } catch (_) { e.textContent = "Can't reach the Video Maker right now. Check your internet and try again."; }
  b.disabled = false;
};

// whom to ask: the public help line (nothing shows if none is set)
fetch("/api/help").then(r => r.json()).then(d => {
  if (d.contact) $("helpText").textContent = d.contact;
}).catch(() => {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

// "Reset a password" appears only when the server says we're on its own computer
fetch("/api/local-reset").then(r => r.json()).then(d => {
  if (!d.available) return;
  $("forgot").classList.remove("hidden");
  $("ru").innerHTML = d.users.map(n => `<option value="${n}">${n}</option>`).join("");
}).catch(() => {});
$("forgot").onclick = () => { $("f").classList.add("hidden"); $("r").classList.remove("hidden"); $("rp").focus(); };
$("back").onclick = () => { $("r").classList.add("hidden"); $("f").classList.remove("hidden"); };

$("r").onsubmit = async ev => {
  ev.preventDefault();
  const e = $("re");
  if ($("rp").value !== $("rp2").value) return e.textContent = "The two passwords don't match.";
  $("rb").disabled = true; e.textContent = "";
  try {
    const r = await fetch("/api/local-reset", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("ru").value, password: $("rp").value }) });
    if (r.ok) return location.href = "/" + location.search;
    e.textContent = (await r.json().catch(() => ({}))).detail || "Couldn't save it.";
  } catch (_) { e.textContent = "Can't reach the server. Try again."; }
  $("rb").disabled = false;
};
</script>
</body>
</html>
